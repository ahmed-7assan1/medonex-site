name: Build and publish static trial site

# Manual trigger only: fork PRs and pushes can never run this, so the
# read-only deploy key secret is never exposed to untrusted code.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (medonex-site)
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout private source (read-only, single-repo deploy key)
        uses: actions/checkout@v4
        with:
          repository: ahmed-7assan1/MedQs0
          ref: github-pages-main
          ssh-key: ${{ secrets.MEDQS0_DEPLOY_KEY }}
          path: src-repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src-repo/package-lock.json

      - name: Install dependencies
        working-directory: src-repo
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: "Static export build (trial subset: landing + docs + faq + offline)"
        working-directory: src-repo
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_TELEMETRY_DISABLED: 1
          PAGES_BASE_PATH: ""
          # Dummy build-time-only values: prisma.ts throws at import when
          # DATABASE_URL is unset; site config falls back safely when the DB
          # is unreachable (4s/6s caps). Never published - only the export ships.
          DATABASE_URL: "postgresql://build:build@localhost:5432/build?connection_limit=1"
          DIRECT_URL: "postgresql://build:build@localhost:5432/build?connection_limit=1"
          # Public-by-design values (they ship inside client bundles on the live
          # site too); stored as secrets to keep the workflow file generic.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: bash scripts/export-pages-trial.sh

      - name: Locate export output
        id: locate
        run: |
          set -e
          OUT_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 5 -name index.html -not -path '*/node_modules/*' -printf '%h\n' 2>/dev/null | sort | head -1)
          if [ -z "$OUT_DIR" ]; then
            echo "FATAL: no exported index.html found anywhere under $GITHUB_WORKSPACE"; exit 1
          fi
          echo "OUT_DIR=$OUT_DIR" | tee -a "$GITHUB_OUTPUT"

      - name: Leak guard - refuse to publish source, env files or secret strings
        run: |
          set -e
          if find "${{ steps.locate.outputs.OUT_DIR }}" -name '.env*' -o -name '*.ts' -o -name '*.tsx' -o -name '*.map' | grep .; then
            echo "Refusing to publish: unexpected source/env files in export output"; exit 1
          fi
          if grep -rIlE 'DATABASE_URL|SERVICE_ROLE|ENCRYPTION_KEY|api_secret|BEGIN .*PRIVATE KEY' "${{ steps.locate.outputs.OUT_DIR }}" 2>/dev/null | grep .; then
            echo "Refusing to publish: secret-looking content in export output"; exit 1
          fi
          echo "leak guard passed"

      - name: Publish build output only
        working-directory: site
        run: |
          set -e
          git config user.name "MedOneX Assistant"
          git config user.email "ahmed.mo7amed.7assan@gmail.com"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'README.md' ! -name 'CNAME' -exec rm -rf {} +
          cp -r "${{ steps.locate.outputs.OUT_DIR }}/." .
          touch .nojekyll
          echo "pages.medonex.me" > CNAME
          cp index.html 404.html
          git add -A
          git commit -m "Static trial export (landing + docs + faq + offline)" || echo "no changes to publish"
          git push
